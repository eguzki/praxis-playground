services:
  # --- Upstream Services (always run) ---

  inference-sim:
    image: ghcr.io/llm-d/llm-d-inference-sim:${INFERENCE_SIM_VERSION:-v0.1.1}
    command:
      - --model
      - mock
      - --port
      - "8000"
      - --mode
      - echo
    ports:
      - "8000:8000"
    networks:
      - praxis-net

  mock-llm:
    image: mockserver/mockserver:${MOCKSERVER_VERSION:-8.0.0}
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/expectations.json
    volumes:
      - ./config/mockserver/expectations.json:/config/expectations.json:ro
    ports:
      - "1080:1080"
    networks:
      - praxis-net

  jwt-issuer:
    build:
      context: ./build/jwt-issuer
    volumes:
      - ./jwt/jwks.json:/usr/share/nginx/html/jwks.json:ro
    ports:
      - "8888:80"
    networks:
      - praxis-net

  # --- Praxis Gateway (configurable) ---

  praxis-gateway:
    build:
      context: ./build/praxis
      args:
        PRAXIS_FEATURES: ${PRAXIS_FEATURES:-full,token-rate-limit-filter}
        PRAXIS_AI_SOURCE: ${PRAXIS_AI_SOURCE:-git:main}
        PRAXIS_CORE_SOURCE: ${PRAXIS_CORE_SOURCE:-crate:0.7.5}
        PRAXIS_POLICY_SOURCE: ${PRAXIS_POLICY_SOURCE:-crate:0.4.1}
        APPLY_RATELIMIT_PATCHES: ${APPLY_RATELIMIT_PATCHES:-false}
    volumes:
      - ./config/praxis/${PRAXIS_CONFIG:-token-rate-limit.yaml}:/etc/praxis/praxis-ai.yaml:ro
      # Policy config for PPE-based configs (will be empty mount if not set)
      - type: bind
        source: ${PRAXIS_POLICY_CONFIG_PATH:-./config/praxis/token-rate-limit.yaml}
        target: /etc/praxis/policy.yaml
        read_only: true
    ports:
      - "8080:8080"  # Data plane
      - "9901:9901"  # Metrics/admin
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      - inference-sim
      - mock-llm
      - jwt-issuer
    networks:
      - praxis-net

networks:
  praxis-net:
    driver: bridge
