services:
  # --- Upstream Services (always run) ---

  inference-sim:
    image: ghcr.io/llm-d/llm-d-inference-sim:${INFERENCE_SIM_VERSION:-v0.1.1}
    command:
      - --model
      - mock
      - --port
      - "8000"
      - --mode
      - echo
    ports:
      - "8000:8000"
    networks:
      - praxis-net

  mock-llm:
    image: mockserver/mockserver:${MOCKSERVER_VERSION:-8.0.0}
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/expectations.json
    volumes:
      - ./config/mockserver/expectations.json:/config/expectations.json:ro
    ports:
      - "1080:1080"
    networks:
      - praxis-net

  jwt-issuer:
    build:
      context: ./build/jwt-issuer
    volumes:
      - ./jwt/jwks.json:/usr/share/nginx/html/jwks.json:ro
    ports:
      - "8888:80"
    networks:
      - praxis-net

  # --- Praxis Gateway ---
  # The image is produced by one of the two build scripts, which also write
  # GATEWAY_IMAGE + PRAXIS_CONFIG into .env:
  #   ./build/build-basic.sh         -> praxis-gateway:basic
  #   ./build/build-experimental.sh  -> praxis-gateway:experimental

  praxis-gateway:
    image: ${GATEWAY_IMAGE:-praxis-gateway:basic}
    # The released image ships ENTRYPOINT=["praxis-ai"] with no default CMD,
    # so point it at the mounted config explicitly (harmless for both images).
    command: ["-c", "/etc/praxis/praxis-ai.yaml"]
    volumes:
      - ./config/praxis/${PRAXIS_CONFIG:-basic.yaml}:/etc/praxis/praxis-ai.yaml:ro
      # Policy config for PPE-based configs (will be empty mount if not set)
      - type: bind
        source: ${PRAXIS_POLICY_CONFIG_PATH:-./config/praxis/basic.yaml}
        target: /etc/praxis/policy.yaml
        read_only: true
    ports:
      - "8080:8080"  # Data plane
      - "9901:9901"  # Metrics/admin
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      - inference-sim
      - mock-llm
      - jwt-issuer
    networks:
      - praxis-net

networks:
  praxis-net:
    driver: bridge
